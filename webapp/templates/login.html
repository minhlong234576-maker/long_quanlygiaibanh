{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <h3 class="text-center mb-1">⚽ V-League</h3>
      <p class="text-center text-muted small mb-4">Hệ thống Quản lý Giải VĐQG Bóng đá</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="mb-3"><label class="form-label">Tên đăng nhập</label>
          <input class="form-control" name="username" required autofocus></div>
        <div class="mb-3"><label class="form-label">Mật khẩu</label>
          <input class="form-control" type="password" name="password" required></div>
        <button class="btn btn-success w-100">Đăng nhập</button>
      </form>
      <hr><p class="small text-muted mb-0">Tài khoản demo (mk: <code>123456</code>):
        <code>admin</code> · <code>kyluat</code> · <code>giaisat</code> · <code>xem</code></p>
    </div>
  </div>
</div>
{% endblock %}
