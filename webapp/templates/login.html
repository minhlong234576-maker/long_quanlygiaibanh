{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="w-100 d-flex justify-content-center">
  <div class="card login-card">
    <div class="text-center mb-4">
      <div class="app-brand-mark mx-auto mb-3">⚽</div>
      <h1 class="page-title fs-3">V-League</h1>
      <p class="page-subtitle">Đăng nhập vào hệ thống Quản lý Giải VĐQG Bóng đá với giao diện tối ưu cho tiếng Việt.</p>
    </div>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="mb-3"><label class="form-label">Tên đăng nhập</label>
        <input class="form-control" name="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Mật khẩu</label>
        <input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-success w-100">Đăng nhập</button>
    </form>
    <hr>
    {# Gợi ý tài khoản demo đã ẩn theo yêu cầu #}
  </div>
</section>
{% endblock %}
